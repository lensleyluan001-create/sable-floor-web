<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f1ebe1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SABLE — Your order</title>
  <meta name="description" content="Track your Sable order. Stage only — no payment on this page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lensleyluan001-create/sable-desk-js@eb7878207d02c63741ff5ab28231b4ecc5c8230e/want.css" />
  <style>
    body { min-height: 100dvh; }
    .house-logo { display: none; }
    .track-page {
      max-width: 420px;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(48px + env(safe-area-inset-bottom, 0px));
    }
    .track-page .kicker {
      letter-spacing: .38em;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted, #6f675e);
      margin: 0;
    }
    .track-page h1 {
      font-family: var(--font-display), Fraunces, serif;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      margin: 12px 0 8px;
    }
    .track-now {
      font-size: 16px;
      line-height: 1.45;
      margin: 0 0 20px;
    }
    .track-shot {
      border-radius: 18px;
      overflow: hidden;
      background: #ece4d8;
      margin: 0 0 16px;
      aspect-ratio: 1 / 1;
    }
    .track-shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .track-pairs {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }
    .track-pairs li {
      padding: 8px 0;
      border-bottom: 1px solid color-mix(in srgb, #1c1814 10%, transparent);
      font-size: 15px;
    }
    .track-page .meta {
      color: var(--muted, #6f675e);
      margin: 0 0 22px;
      font-size: 14px;
    }
    .track-steps {
      list-style: none;
      padding: 0;
      margin: 0 0 28px;
    }
    .track-steps li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      color: var(--muted, #6f675e);
    }
    .track-steps .dot {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      margin-top: 4px;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, #1c1814 28%, transparent);
      background: transparent;
    }
    .track-steps li.done .dot {
      background: #1c1814;
      border-color: #1c1814;
    }
    .track-steps li.now {
      color: #1c1814;
      font-weight: 600;
    }
    .track-steps li.now .dot {
      width: 14px;
      height: 14px;
      margin-top: 3px;
      background: #1c1814;
      border-color: #1c1814;
      box-shadow: 0 0 0 4px color-mix(in srgb, #1c1814 10%, transparent);
    }
    .track-steps li.wait .lab { color: var(--subtle, #8a8278); }
    .track-foot { margin-top: 8px; }
    .client-link {
      color: #1c1814;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="track-page" id="track">
    <p class="kicker">SABLE</p>
    <h1>Your order</h1>
    <p class="sub">Looking it up.</p>
  </main>
  <script src="./sentry.js?v=20260906sentry"></script>
  <script>try{sableSentry("track")}catch(e){}</script>
  <script src="https://cdn.jsdelivr.net/gh/lensleyluan001-create/sable-desk-js@ded0636b11750ede39a996a67e3b01491cc1a6c1/track-app.js"></script>
</body>
</html>
