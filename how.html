<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16110e" />
  <title>SABLE — How we work</title>
  <meta name="description" content="Order. Confirm. Send. How a pair leaves SABLE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #16110e;
      --paper: #e8dfd0;
      --paper-2: #d7ccb8;
      --dust: #c6b396;
      --line: rgb(232 223 208 / 0.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Figtree, "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    #spacer { pointer-events: none; }
    .stage { position: fixed; inset: 0; overflow: hidden; }
    .layer {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden;
    }
    .layer img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.08);
    }
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top, rgb(22 17 14 / 0.78) 0%, rgb(22 17 14 / 0.28) 38%, transparent 78%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgb(22 17 14 / 0.55) 100%);
    }
    header {
      position: absolute; inset: 0 auto auto 0; z-index: 3;
      padding: calc(20px + env(safe-area-inset-top)) 20px 0;
      max-width: 640px;
    }
    .mark {
      margin: 0;
      letter-spacing: .32em;
      font-size: 11px;
      font-weight: 600;
    }
    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
    }
    .kicker {
      margin: 24px 0 0;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    .why {
      margin: 8px 0 0;
      font-family: Fraunces, "Iowan Old Style", Palatino, serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.02em;
      line-height: 1.25;
      max-width: 18em;
    }
    .copy {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      padding: 0 20px calc(24px + env(safe-area-inset-bottom));
      max-width: 640px;
    }
    .copy h1 {
      margin: 0;
      font-family: Fraunces, "Iowan Old Style", Palatino, serif;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.05;
    }
    .copy p { margin: 14px 0 0; max-width: 28em; line-height: 1.55; color: var(--paper-2); }
    .meta {
      margin-top: 18px !important;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    .hint {
      position: absolute; left: 50%; bottom: 24px; z-index: 3;
      transform: translateX(-50%);
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    nav {
      display: none;
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      flex-direction: column;
      max-height: 70vh;
    }
    nav button {
      min-height: 32px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      text-align: right;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--dust);
    }
    nav button[aria-current="true"] { color: var(--paper); }
    @media (min-width: 900px) { nav { display: flex; } header, .copy { padding-left: 32px; } }
  </style>
</head>
<body>
  <div id="spacer"></div>
  <div class="stage">
    <div id="layers"></div>
    <div class="scrim"></div>
    <div class="vignette"></div>
    <header>
      <p class="mark">SABLE.CO</p>
      <a class="back" href="/want">Back to the collection</a>
      <p class="kicker" id="kicker"></p>
      <p class="why" id="why"></p>
    </header>
    <nav id="nav" aria-label="How we work"></nav>
    <div class="copy">
      <h1 id="title"></h1>
      <p id="line"></p>
      <p class="meta" id="meta"></p>
    </div>
    <p class="hint" id="hint">Scroll</p>
  </div>
  <script>
    const CHAPTERS = [
      { last: "The bench", why: "Order. Confirm. Send. The bench is the truth.", title: "A pair leaves like this.", line: "No cart. No card on the page. The floor, then the last, then the road.", meta: "SABLE.CO  ·  Handmade in our factory", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/house.jpg" },
      { last: "The book", why: "The 45xxx is the stock number. The rand is listed.", title: "Pick the pair.", line: "Ninety-two pairs. The name is the type. You take the number. You do not guess.", meta: "Stock 45001–45092", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/book.jpg" },
      { last: "The order", why: "No card. Name, UK size, WhatsApp.", title: "Send it.", line: "We log it on the floor. A checkout does not last a shoe.", meta: "WhatsApp  ·  No payment yet", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/order.jpg" },
      { last: "The floor", why: "Not a website ticket. A bench list.", title: "On the floor.", line: "A salesperson writes the 45xxx. The floor is the book now.", meta: "Logged by hand", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/floor.jpg" },
      { last: "Confirm", why: "If it is not on the bench, we say so.", title: "We look.", line: "The pair is there or it is not. We do not invent stock. Then we WhatsApp you. Then EFT.", meta: "Confirm, then you pay", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/confirm.jpg" },
      { last: "Cut", why: "We cut in-house. Lead times come back to us.", title: "The hide.", line: "Vegetable tan. A knife. The shape of a last on the table.", meta: "Cut here", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/cut.jpg" },
      { last: "Last", why: "The last is ours. So is the pair that leaves.", title: "Lasted here.", line: "Upper onto wood. The pair takes the shape we keep.", meta: "In-house", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/house.jpg" },
      { last: "Stitch", why: "The stitch leaves with the pair.", title: "Waxed thread.", line: "Awl. Welt. The work you cannot sticker on.", meta: "Made on the bench", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/stitch.jpg" },
      { last: "Finish", why: "Then the bench says yes.", title: "Ready.", line: "The pair is there. We tell you. Not before.", meta: "From the bench", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/derby.jpg" },
      { last: "Pack", why: "Paper. The pair. Nothing louder.", title: "Wrapped.", line: "It leaves the bench the way it was lasted. Clean.", meta: "From the house", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/pack.jpg" },
      { last: "Send", why: "Collect no fee. Local R100. International R300.", title: "Collect, or we send.", line: "Close? Come. Further? We send it. A manager can change the fee.", meta: "Collect  ·  Local  ·  Abroad", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/send.jpg" },
      { last: "Tuesday", why: "You wear them. Not to a photoshoot.", title: "The point.", line: "A crease that knows the road. That is the order, finished.", meta: "Order. Confirm. Send.", still: "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/vellie.jpg" }
    ];
    const N = CHAPTERS.length;
    const CROSS = 0.16;
    const layersEl = document.getElementById("layers");
    const nav = document.getElementById("nav");
    const spacer = document.getElementById("spacer");
    const hint = document.getElementById("hint");
    const layerEls = [];
    const ticks = [];
    spacer.style.height = (N * 155) + "vh";
    CHAPTERS.forEach((ch, i) => {
      const layer = document.createElement("div");
      layer.className = "layer";
      layer.innerHTML = '<img alt="" src="' + ch.still + '">';
      layersEl.appendChild(layer);
      layerEls.push(layer);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = ch.last.replace(/^The /, "");
      btn.setAttribute("aria-label", ch.last);
      btn.onclick = () => {
        const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
        scrollTo({ top: (i / N) * max + 8, behavior: "auto" });
      };
      nav.appendChild(btn);
      ticks.push(btn);
    });
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function opacity(i, pos) {
      if (i === N - 1 && pos >= N - 1) return 1;
      if (i === 0 && pos <= 0) return 1;
      const local = pos - i;
      if (local <= -CROSS || local >= 1 + CROSS) return 0;
      if (local < 0) return 1 + local / CROSS;
      if (local > 1) return 1 - (local - 1) / CROSS;
      if (local > 1 - CROSS) return 1 - (local - (1 - CROSS)) / CROSS;
      return 1;
    }
    let chapter = 0;
    function setCopy(i) {
      const ch = CHAPTERS[i];
      document.getElementById("kicker").textContent = ch.last;
      document.getElementById("why").textContent = ch.why;
      document.getElementById("title").textContent = ch.title;
      document.getElementById("line").textContent = ch.line;
      document.getElementById("meta").textContent = ch.meta;
      ticks.forEach((b, n) => b.setAttribute("aria-current", n === i ? "true" : "false"));
    }
    setCopy(0);
    let pos = 0;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function tick() {
      const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const target = clamp(scrollY / max, 0, 1);
      pos += (target - pos) * (reduced ? 1 : 0.085);
      const p = pos * N;
      let best = 0, bestOp = -1;
      layerEls.forEach((el, i) => {
        const op = opacity(i, p);
        el.style.opacity = String(op);
        el.style.visibility = op < 0.02 ? "hidden" : "visible";
        const img = el.querySelector("img");
        const local = clamp(p - i, 0, 1);
        img.style.transform = "scale(" + (1.08 - local * 0.08) + ")";
        if (op > bestOp) { bestOp = op; best = i; }
      });
      if (best !== chapter) { chapter = best; setCopy(best); }
      hint.style.opacity = String(clamp(1 - pos * 10, 0, 1));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
