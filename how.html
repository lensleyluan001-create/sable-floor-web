<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16110e" />
  <title>SABLE — How an order works</title>
  <meta name="description" content="Tap a pair. We WhatsApp you. Pay after we confirm. Most pairs leave in 10–14 working days." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #16110e;
      --paper: #e8dfd0;
      --paper-2: #d7ccb8;
      --dust: #c6b396;
      --line: rgb(232 223 208 / 0.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Figtree, "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    #spacer { pointer-events: none; }
    .stage { position: fixed; inset: 0; overflow: hidden; }
    .layer {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden;
    }
    .layer img, .layer video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.08);
    }
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top, rgb(22 17 14 / 0.78) 0%, rgb(22 17 14 / 0.28) 38%, transparent 78%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgb(22 17 14 / 0.55) 100%);
    }
    header {
      position: absolute; inset: 0 auto auto 0; z-index: 3;
      padding: calc(20px + env(safe-area-inset-top)) 20px 0;
      max-width: 640px;
    }
    .mark {
      margin: 0;
      letter-spacing: .32em;
      font-size: 11px;
      font-weight: 600;
    }
    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
    }
    .kicker {
      margin: 24px 0 0;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    .why {
      margin: 8px 0 0;
      font-family: Fraunces, "Iowan Old Style", Palatino, serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.02em;
      line-height: 1.25;
      max-width: 18em;
    }
    .copy {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      padding: 0 20px calc(24px + env(safe-area-inset-bottom));
      max-width: 640px;
    }
    .copy h1 {
      margin: 0;
      font-family: Fraunces, "Iowan Old Style", Palatino, serif;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.05;
    }
    .copy p { margin: 14px 0 0; max-width: 28em; line-height: 1.55; color: var(--paper-2); }
    .meta {
      margin-top: 18px !important;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    .hint {
      position: absolute; left: 50%; bottom: 24px; z-index: 3;
      transform: translateX(-50%);
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--dust);
    }
    nav {
      display: none;
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      flex-direction: column;
      max-height: 70vh;
    }
    nav button {
      min-height: 32px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      text-align: right;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--dust);
    }
    nav button[aria-current="true"] { color: var(--paper); }
    @media (min-width: 900px) { nav { display: flex; } header, .copy { padding-left: 32px; } }
  </style>
</head>
<body>
  <div id="spacer"></div>
  <div class="stage">
    <div id="layers"></div>
    <div class="scrim"></div>
    <div class="vignette"></div>
    <header>
      <p class="mark">SABLE</p>
      <a class="back" href="/want">Back to the shoes</a>
      <p class="kicker" id="kicker"></p>
      <p class="why" id="why"></p>
    </header>
    <nav id="nav" aria-label="How an order works"></nav>
    <div class="copy">
      <h1 id="title"></h1>
      <p id="line"></p>
      <p class="meta" id="meta"></p>
    </div>
    <p class="hint" id="hint">Scroll</p>
  </div>
  <script>
    const LOOK = "https://raw.githubusercontent.com/lensleyluan001-create/sable-looks/main/film/";
    const CHAPTERS = [
      { last: "The pair", why: "Tap the shoe you want. Photos swipe.", title: "Pick the pair you like.", line: "Vellies, golfers, chelseas, boots. The price on the card is the pair. Extras are extra — R50 each, written next to them.", meta: "Made in South Africa", still: LOOK + "book.jpg" },
      { last: "Send", why: "Name and WhatsApp. We reply.", title: "Send it to us.", line: "Pick UK size (we show EU too) and hide. Add another pair if you want. Then send. We WhatsApp you on the number you gave.", meta: "Pay after we confirm", still: LOOK + "order.jpg" },
      { last: "Confirm", why: "We check the bench. Then you pay.", title: "We confirm. Then EFT.", line: "If the pair is there, we send the listed rand. You pay. That is when the pair is yours — not before.", meta: "Confirm, then pay", still: LOOK + "confirm.jpg" },
      { last: "Make", why: "Cut, stitch, finish here.", title: "We make it here.", line: "Once paid, most pairs leave in 10–14 working days. Handmade in our factory in South Africa.", meta: "10–14 working days after pay", still: LOOK + "cut.jpg" },
      { last: "Laser", why: "Outside only. R50.", title: "A mark on the outside.", line: "Heel, quarter, or vamp. Initials, a name, or a logo. R50. Logo we confirm before we burn.", meta: "R50  ·  Outside only", still: LOOK + "laser.jpg" },
      { last: "Leave", why: "Collect free. SA R100. Abroad R300.", title: "Collect, or we send.", line: "Close enough? Collect, no fee. In South Africa we send for R100. Abroad R300.", meta: "Collect  ·  SA R100  ·  Abroad R300", still: LOOK + "send.jpg" }
    ];
    const N = CHAPTERS.length;
    const CROSS = 0.16;
    const layersEl = document.getElementById("layers");
    const nav = document.getElementById("nav");
    const spacer = document.getElementById("spacer");
    const hint = document.getElementById("hint");
    const layerEls = [];
    const ticks = [];
    spacer.style.height = (N * 155) + "vh";
    CHAPTERS.forEach((ch, i) => {
      const layer = document.createElement("div");
      layer.className = "layer";
      layer.innerHTML = '<img alt="" src="' + ch.still + '">';
      layersEl.appendChild(layer);
      layerEls.push(layer);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = ch.last.replace(/^The /, "");
      btn.setAttribute("aria-label", ch.last);
      btn.onclick = () => {
        const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
        scrollTo({ top: (i / Math.max(1, N - 1)) * max + 8, behavior: "smooth" });
      };
      nav.appendChild(btn);
      ticks.push(btn);
    });
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function opacity(i, pos) {
      if (i === N - 1 && pos >= N - 1) return 1;
      if (i === 0 && pos <= 0) return 1;
      const local = pos - i;
      if (local <= -CROSS || local >= 1 + CROSS) return 0;
      if (local < 0) return 1 + local / CROSS;
      if (local > 1) return 1 - (local - 1) / CROSS;
      if (local > 1 - CROSS) return 1 - (local - (1 - CROSS)) / CROSS;
      return 1;
    }
    let chapter = 0;
    function setCopy(i) {
      const ch = CHAPTERS[i];
      document.getElementById("kicker").textContent = ch.last;
      document.getElementById("why").textContent = ch.why;
      document.getElementById("title").textContent = ch.title;
      document.getElementById("line").textContent = ch.line;
      document.getElementById("meta").textContent = ch.meta;
      ticks.forEach((b, n) => b.setAttribute("aria-current", n === i ? "true" : "false"));
    }
    setCopy(0);
    let pos = 0;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function tick() {
      const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const target = clamp(scrollY / max, 0, 1);
      pos += (target - pos) * (reduced ? 1 : 0.085);
      const p = pos * Math.max(0, N - 1);
      let best = 0, bestOp = -1;
      layerEls.forEach((el, i) => {
        const op = opacity(i, p);
        el.style.opacity = String(op);
        el.style.visibility = op < 0.02 ? "hidden" : "visible";
        const img = el.querySelector("img");
        const local = clamp(p - i, 0, 1);
        if (img) img.style.transform = "scale(" + (1.08 - local * 0.08) + ")";
        if (op > bestOp) { bestOp = op; best = i; }
      });
      if (best !== chapter) { chapter = best; setCopy(best); }
      hint.style.opacity = String(clamp(1 - pos * 10, 0, 1));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
